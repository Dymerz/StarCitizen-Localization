name: Releases
on:
  push:
    tags:
    - '*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Package localization
      uses: ./.github/actions/package-localization

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          data/*.zip
          tools/*.cmd
          tools/*.ps1
        draft: true
